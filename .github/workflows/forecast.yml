name: Shwas Hourly ML Forecast

on:
  schedule:
    # Three off-peak schedules per hour (minutes 17, 37 & 47 UTC) for redundancy against GitHub Actions delays
    - cron: '17 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Generate 48-hour PM2.5 forecasts and push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python ml/predict.py

