name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run Vitest suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  ml-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ML and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt ruff

      - name: Ruff lint
        working-directory: ml
        run: ruff check .

      - name: Ruff format check
        working-directory: ml
        run: ruff format --check .

      - name: Run ML pytest suite
        working-directory: ml
        run: pytest
